# Keep README visual evidence synchronized with the generated result figures.
name: Add README result visuals

on:
  push:
    branches: [main]
    paths:
      - "results/figures/**"
      - "scripts/update_readme_visuals.py"
      - ".github/workflows/readme_visuals.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert visual results section
        run: python scripts/update_readme_visuals.py
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README visuals already current."
          else
            git commit -m "Add visual result summary to README"
            git push origin HEAD:main
          fi
