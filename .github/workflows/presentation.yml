# Rebuild when presentation source changes; final author names are in build_deck.js.
name: Build presentation deck

on:
  push:
    branches: [main]
    paths:
      - presentation/build_deck.js
      - .github/workflows/presentation.yml

permissions:
  contents: write

jobs:
  build-deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deck generator
        run: npm install --no-save pptxgenjs
      - name: Build PowerPoint
        run: node presentation/build_deck.js
      - name: Install LibreOffice for PDF export
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress
      - name: Export PDF
        run: |
          libreoffice --headless --convert-to pdf --outdir presentation presentation/WISER_Vanguard_Quantum_Portfolio_Challenge_2026.pptx
      - name: Commit generated deck
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation/WISER_Vanguard_Quantum_Portfolio_Challenge_2026.pptx presentation/WISER_Vanguard_Quantum_Portfolio_Challenge_2026.pdf
          if git diff --cached --quiet; then
            echo "Presentation deck is already current."
          else
            git commit -m "Build submission presentation deck"
            git push origin HEAD:main
          fi
