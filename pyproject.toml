[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard-quantum-portfolio-copilot"
version = "0.1.0"
description = "Constrained multi-asset portfolio co-pilot with reduced QAOA and exploratory higher-moment VQE benchmarks"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.24.3",
  "scipy==1.11.4",
  "pandas==2.1.4",
  "streamlit==1.29.0",
  "plotly==5.18.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
